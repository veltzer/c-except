# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile built two shared libraries (libexcept.so from lib/except.c and
# libexceptcc.so from lib/exceptcc.cc, -shared -fpic -ldl) and four test
# binaries, two of which link the libraries. That multi-object, lib-before-tests
# link is beyond the single-file C processor, so scripts/build_except.py runs
# the exact sequence. (The Makefile's install target was a separate `sudo
# install` to /usr -- a deploy action, not a build.)
[processor.explicit.except]
command = "scripts/build_except.py"
input_globs = ["lib/*.c", "lib/*.cc", "lib/*.h", "test/*.c", "test/*.cc"]
output_files = [
    "libexcept.so",
    "libexceptcc.so",
    "test/test_link.elf",
    "test/test_linkcc.elf",
    "test/test_nolink.elf",
    "test/test_nolinkcc.elf",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["lib", "test"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]
